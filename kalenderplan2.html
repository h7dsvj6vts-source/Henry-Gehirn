<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Henry Kalender-Manager v2.0</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #f5f5f7; padding: 20px; margin: 0; }
        .revision-tag { position: absolute; top: 15px; right: 20px; background: #30d158; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; color: #000; font-weight: bold; }
        .card { background: #1c1c1e; padding: 20px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); max-width: 600px; margin: 40px auto 20px auto; }
        h1 { font-size: 1.5rem; margin-top: 0; color: #30d158; }
        .task-item { background: #2c2c2e; padding: 15px; border-radius: 8px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #30d158; }
        .task-details { flex-grow: 1; padding-right: 10px; }
        .task-title { font-weight: bold; font-size: 1rem; color: #fff; }
        .task-time { font-size: 0.85rem; color: #aeaeab; margin-top: 4px; }
        button.cal-btn { background: #30d158; border: none; border-radius: 6px; color: black; padding: 8px 14px; font-weight: bold; cursor: pointer; font-size: 0.9rem; white-space: nowrap; }
        .no-tasks { color: #aeaeab; font-style: italic; text-align: center; padding: 20px; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #30d158; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="revision-tag">REV V2.0 (prod)</div>

    <div class="card">
        <h1>🗓️ Henry-COO Kalender-Verarbeitung v2.0</h1>
        <p>Gefundene Termine aus der letzten Agenten-Antwort für den Kalender <strong>"Henry"</strong>:</p>
        
        <div id="taskList">
            <div class="no-tasks">Lade Daten aus dem Speicher...</div>
        </div>
        
        <a href="Index.html" class="back-link">← Zurück zur Agenten-Farm</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const rawText = localStorage.getItem('henry_last_response');
            const taskListContainer = document.getElementById('taskList');
            
            if (!rawText) {
                taskListContainer.innerHTML = '<div class="no-tasks">Keine Daten im Speicher gefunden. Bitte sende zuerst einen Befehl im Hauptmenü.</div>';
                return;
            }

            let cooText = "";
            const cooMatch = rawText.match(/\[COO-Agent\]:?([\s\S]*?)(?=\[(?:CEO|CFO|CIO)-Agent\]|$)/i);
            
            if (cooMatch && cooMatch[1]) {
                cooText = cooMatch[1].trim();
            } else {
                cooText = rawText; 
            }

            // KORREKTUR: Trennt nun auch bei Aufzählungszeichen (-, *, •) und Absätzen sauber
            const lines = cooText.split(/\n|,|\.|\-|\*|•/).map(l => l.trim()).filter(l => l.length > 3);
            const tasks = [];
            
            // KORREKTUR: Dynamisches, echtes Tagesdatum statt statischem Wert
            const heute = new Date(); 

            lines.forEach(line => {
                // Findet Formate wie "15:00", "15 Uhr", "9:30"
                const timeMatch = line.match(/(\d{1,2})(?::(\d{2}))?\s*(?:Uhr)?/i);
                if (timeMatch) {
                    let stunde = parseInt(timeMatch[1]);
                    let minute = timeMatch[2] ? parseInt(timeMatch[2]) : 0;
                    
                    let terminDatum = new Date(heute);
                    if (line.toLowerCase().includes("morgen")) {
                        terminDatum.setDate(heute.getDate() + 1);
                    } else if (line.toLowerCase().includes("übermorgen")) {
                        terminDatum.setDate(heute.getDate() + 2);
                    }

                    // Bereinige den Text von System- und Zeitphrasen für den Kalendertitel
                    let titel = line
                        .replace(/\[COO-Agent\]/gi, '')
                        .replace(/um\s*\d{1,2}(?::\d{2})?\s*(?:Uhr)?/gi, '')
                        .replace(/\d{1,2}(?::\d{2})?\s*Uhr/gi, '')
                        .replace(/(heute|morgen|übermorgen)/gi, '')
                        .trim();

                    if (titel.length > 2) {
                        tasks.push({
                            title: titel.charAt(0).toUpperCase() + titel.slice(1),
                            date: terminDatum,
                            stunde: stunde,
                            minute: minute
                        });
                    }
                }
            });

            if (tasks.length === 0) {
                taskListContainer.innerHTML = '<div class="no-tasks">Keine konkreten Termine im Text des COO-Agenten erkannt.</div>';
                return;
            }

            taskListContainer.innerHTML = "";
            tasks.forEach((task, index) => {
                const dateStr = task.date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const timeStr = `${String(task.stunde).padStart(2, '0')}:${String(task.minute).padStart(2, '0')} Uhr`;

                const start = new Date(task.date);
                start.setHours(task.stunde, task.minute, 0);
                const end = new Date(start);
                end.setHours(start.getHours() + 1);

                const item = document.createElement('div');
                item.className = 'task-item';
                item.innerHTML = `
                    <div class="task-details">
                        <div class="task-title">${task.title}</div>
                        <div class="task-time">📅 ${dateStr} um ${timeStr}</div>
                    </div>
                    <button class="cal-btn" onclick="triggereAppleShortcut('${btoa(unescape(encodeURIComponent(task.title)))}', '${start.toISOString()}', '${end.toISOString()}')">🗓️ In Kalender</button>
                `;
                taskListContainer.appendChild(item);
            });
        });

        function triggereAppleShortcut(base64Title, startIso, endIso) {
            const title = decodeURIComponent(escape(atob(base64Title)));
            const datenPaket = `Titel: ${title}\nStart: ${startIso}\nEnde: ${endIso}`;
            
            const shortcutUrl = `shortcuts://run-shortcut?name=HenryKalender&input=text&text=${encodeURIComponent(datenPaket)}`;
            window.location.href = shortcutUrl;
        }
    </script>
</body>
</html>
