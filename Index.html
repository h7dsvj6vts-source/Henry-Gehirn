<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Henry Agenten-Farm MVP</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .card { background: #1c1c1e; padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; }
        input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; box-sizing: border-box; }
        input, textarea { background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c; }
        button { background: #30d158; border: none; color: white; font-weight: bold; cursor: pointer; }
        #output { background: #2c2c2e; padding: 15px; border-left: 4px solid #30d158; min-height: 80px; white-space: pre-wrap; margin-top: 15px; }
    </style>
    
    <!-- ADLER-LÖSUNG: Wir laden das offizielle Google AI Studio SDK direkt in den Browser -->
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run"
        }
      }
    </script>
</head>
<body>

    <div class="card">
        <h1>🤖 Henry-CEO MVP (SDK Version)</h1>
        <input type="password" id="apiKey" placeholder="Google Gemini API-Key hier einfügen">
        <textarea id="taskInput" rows="3" placeholder="Befehl eingeben..."></textarea>
        <button id="sendBtn">🚀 Befehl senden</button>
        <div id="output">Bereit. Gib einen Befehl ein.</div>
    </div>

    <script type="module">
        // Importieren der offiziellen Google-Bibliothek
        import { GoogleGenerativeAI } from "@google/generative-ai";

        if(localStorage.getItem('henry_key')) {
            document.getElementById('apiKey').value = localStorage.getItem('henry_key');
        }

        document.getElementById('sendBtn').addEventListener('click', async () => {
            const key = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('taskInput').value.trim();
            const output = document.getElementById('output');

            if(!key || !prompt) {
                alert("Bitte Key und Befehl eingeben!");
                return;
            }

            localStorage.setItem('henry_key', key);
            output.innerText = "⏳ Das Google SDK übernimmt... Verbindung wird aufgebaut...";

            try {
                // Initialisierung über die offizielle Google-Klasse (umgeht CORS-Direktblockaden)
                const genAI = new GoogleGenerativeAI(key);
                const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });

                const systemPrompt = "Du bist der CEO einer KI-Agenten-Farm. Antworte kurz im Namen von [CEO], [CFO] und [COO] auf folgenden Befehl: ";
                
                const result = await model.generateContent(systemPrompt + prompt);
                const response = await result.response;
                
                // Ausgabe des Ergebnisses auf dem Bildschirm
                output.innerText = response.text();

            } catch (error) {
                // Präzises Abfangen, falls der Key falsch ist oder Google ein anderes Problem meldet
                output.innerText = "🚨 Fehler im Google SDK:\n" + error.message;
            }
        });
    </script>
</body>
</html>
