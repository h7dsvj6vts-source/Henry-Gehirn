<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Henry Agenten-Farm MVP</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #f5f5f7; padding: 20px; margin: 0; }
        .card { background: #1c1c1e; padding: 20px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 15px; }
        h1 { font-size: 1.5rem; margin-top: 0; color: #30d158; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #30d158; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button.mic { background: #0a84ff; }
        #output { white-space: pre-wrap; background: #2c2c2e; padding: 15px; border-radius: 8px; min-height: 100px; margin-top: 15px; border-left: 4px solid #30d158; font-size: 0.95rem; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🤖 Henry-CEO (Gemini MVP)</h1>
        
        <label>Dein Gratis Google Gemini API-Key:</label>
        <input type="password" id="apiKey" placeholder="AIzaSy...">
        
        <label>Dein Befehl an die Farm:</label>
        <textarea id="taskInput" rows="4" placeholder="Spreche oder schreibe etwas..."></textarea>
        
        <button class="mic" id="micBtn">🎙️ Per Sprache eingeben</button>
        <button id="sendBtn">🚀 Befehl senden</button>
    </div>

    <div class="card">
        <h3>📋 Agenten-Feedback:</h3>
        <div id="output">Bereit. Gib mir einen Befehl.</div>
    </div>

    <script>
        if(localStorage.getItem('henry_gemini_key')) {
            document.getElementById('apiKey').value = localStorage.getItem('henry_gemini_key');
        }

        const micBtn = document.getElementById('micBtn');
        const taskInput = document.getElementById('taskInput');
        
        if ('webkitSpeechRecognition' in window) {
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
                micBtn.innerText = "⏳ Ich höre zu...";
                micBtn.style.background = "#ff9f0a";
            });

            recognition.onresult = (event) => {
                taskInput.value = event.results.transcript;
                micBtn.innerText = "🎙️ Per Sprache eingeben";
                micBtn.style.background = "#0a84ff";
            };
            recognition.onerror = () => { micBtn.innerText = "🎙️ Fehler!"; micBtn.style.background = "#0a84ff"; };
        } else {
            micBtn.style.display = 'none'; 
        }

        document.getElementById('sendBtn').addEventListener('click', async () => {
            const key = document.getElementById('apiKey').value;
            const prompt = taskInput.value;
            const output = document.getElementById('output');

            if(!key || !prompt) { alert("Bitte Key und Befehl eingeben!"); return; }
            localStorage.setItem('henry_gemini_key', key);
            output.innerText = "🤖 CEO simuliert die Farm-Antwort über Gemini...";

            const systemPrompt = "Du bist die Schaltzentrale von Henrys privater KI-Agenten-Farm. Deine Aufgabe ist es, den eingehenden Befehl zu analysieren und zu simulieren, wie die Abteilungen (CFO für Finanzen, COO für SmartHome/Kalender, CIO für Wissen/Dokumente) darauf reagieren würden. Antworte strukturiert im Namen des [CEO-Agent], [CFO-Agent], [COO-Agent] und [CIO-Agent]. Halte es kurz und prägnant.";

            // Google Gemini API Endpoint für das kostenlose gemini-2.5-flash Modell
            const url = `https://googleapis.com{key}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `${systemPrompt}\n\nHenrys Befehl: ${prompt}` }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    output.innerText = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    throw new Error(data.error.message);
                } else {
                    throw new Error("Unerwartete API-Antwort");
                }
            } catch (error) {
                output.innerText = "🚨 Fehler: " + error.message;
            }
        });
    </script>
</body>
</html>
