    <script>
        if(localStorage.getItem('henry_gemini_key')) {
            document.getElementById('apiKey').value = localStorage.getItem('henry_gemini_key');
        }

        const micBtn = document.getElementById('micBtn');
        const taskInput = document.getElementById('taskInput');
        
        if ('webkitSpeechRecognition' in window) {
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                recognition.start();
                micBtn.innerText = "⏳ Ich höre zu...";
                micBtn.style.background = "#ff9f0a";
            });

            // KORREKTUR: Richtiger Pfad zum Text im event-Objekt
            recognition.onresult = (event) => {
                taskInput.value = event.results[0][0].transcript;
                micBtn.innerText = "🎙️ Per Sprache eingeben";
                micBtn.style.background = "#0a84ff";
            };
            
            recognition.onerror = () => { 
                micBtn.innerText = "🎙️ Fehler!"; 
                micBtn.style.background = "#0a84ff"; 
            };
        } else {
            micBtn.style.display = 'none'; 
        }

        document.getElementById('sendBtn').addEventListener('click', async () => {
            const key = document.getElementById('apiKey').value;
            const prompt = taskInput.value;
            const output = document.getElementById('output');

            if(!key || !prompt) { alert("Bitte Key und Befehl eingeben!"); return; }
            localStorage.setItem('henry_gemini_key', key);
            output.innerText = "🤖 CEO simuliert die Farm-Antwort über Gemini...";

            const systemPrompt = "Du bist die Schaltzentrale von Henrys privater KI-Agenten-Farm. Deine Aufgabe ist es, den eingehenden Befehl zu analysieren und zu simulieren, wie die Abteilungen (CFO für Finanzen, COO für SmartHome/Kalender, CIO für Wissen/Dokumente) darauf reagieren würden. Antworte strukturiert im Namen des [CEO-Agent], [CFO-Agent], [COO-Agent] und [CIO-Agent]. Halte es kurz und prägnant.";

            // KORREKTUR: Slashes korrigiert und String-Literal mit ` geschlossen
            const url = `https://googleapis.com{key}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `${systemPrompt}\n\nHenrys Befehl: ${prompt}` }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    output.innerText = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    throw new Error(data.error.message);
                } else {
                    throw new Error("Unerwartete API-Antwort");
                }
            } catch (error) {
                output.innerText = "🚨 Fehler: " + error.message;
            }
        });
    </script>
