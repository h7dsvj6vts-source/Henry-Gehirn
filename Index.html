<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Henry Agenten-Farm MVP</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .card { background: #1c1c1e; padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; }
        input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; box-sizing: border-box; }
        input, textarea { background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c; }
        button { background: #30d158; border: none; color: white; font-weight: bold; cursor: pointer; }
        #output { background: #2c2c2e; padding: 15px; border-left: 4px solid #30d158; min-height: 80px; white-space: pre-wrap; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🤖 Henry-CEO MVP</h1>
        <input type="password" id="apiKey" placeholder="Google Gemini API-Key hier einfügen">
        <textarea id="taskInput" rows="3" placeholder="Befehl eingeben..."></textarea>
        <button id="sendBtn">🚀 Befehl senden</button>
        <div id="output">Bereit. Gib einen Befehl ein.</div>
    </div>

    <script>
        if(localStorage.getItem('henry_key')) {
            document.getElementById('apiKey').value = localStorage.getItem('henry_key');
        }

        document.getElementById('sendBtn').addEventListener('click', async () => {
            const key = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('taskInput').value.trim();
            const output = document.getElementById('output');

            if(!key || !prompt) {
                alert("Bitte Key und Befehl eingeben!");
                return;
            }

            localStorage.setItem('henry_key', key);
            output.innerText = "⏳ Verbinde mit Gemini...";

            const url = `https://googleapis.com{key}`;
            
            const payload = {
                contents: [{
                    parts: [{ text: "Du bist der CEO einer KI-Agenten-Farm. Antworte kurz im Namen von [CEO], [CFO] und [COO] auf folgenden Befehl: " + prompt }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                // ADLER-KORREKTUR: Robuster Fallback, der die echte Struktur garantiert ausliest
                if (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
                    output.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    // Falls Google einen Fehler sendet, wird das gesamte JSON roh ausgegeben, damit du siehst was los ist
                    output.innerText = "Antwort erhalten, aber Struktur weicht ab:\n" + JSON.stringify(data, null, 2);
                }

            } catch (error) {
                output.innerText = "🚨 Fehler: " + error.message;
            }
        });
    </script>
</body>
</html>
